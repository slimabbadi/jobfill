<form>
  <fieldset><legend>Meine Daten</legend>
    <div><label for="input-candidate.name">Vor- und Nachname <span>*</span></label><input type="text" id="input-candidate.name" name="candidate.name" autocomplete="name" required></div>
    <div><label for="input-candidate.email">E-Mail-Adresse <span>*</span></label><input type="email" id="input-candidate.email" name="candidate.email" autocomplete="email" required></div>
    <div><button type="button" id="country-select-input" aria-haspopup="listbox" aria-label="Ländervorwahl auswählen: Deutschland">+49</button>
      <label for="input-candidate.phone">Telefonnummer <span>*</span></label><input type="tel" id="input-candidate.phone" name="candidate.phone" autocomplete="tel" value="+49" required></div>
  </fieldset>
  <div><label for="input-candidate.cv">Lebenslauf <span>*</span></label><input type="file" id="input-candidate.cv" name="candidate.cv" required></div>
  <fieldset><legend>Fragen</legend>
    <div><label for="q1">Gehaltsvorstellung <span>*</span></label><input type="text" id="q1" name="candidate.openQuestionAnswers.7673337.content" autocomplete="on" required></div>
    <div><label for="q2">Xing</label><input type="text" id="q2" name="candidate.openQuestionAnswers.7673338.content" autocomplete="on"></div>
    <div><label for="q3">LinkedIn</label><input type="text" id="q3" name="candidate.openQuestionAnswers.7673339.content" autocomplete="on"></div>
    <div><label for="q4">Github/Gitlab oder andere</label><input type="text" id="q4" name="candidate.openQuestionAnswers.7673340.content" autocomplete="on"></div>
    <div><label for="q5">Möchtest Du noch etwas los werden?</label><textarea id="q5" name="candidate.openQuestionAnswers.7673341.content"></textarea></div>
  </fieldset>
  <fieldset><legend>Rechtliche Vereinbarungen</legend>
    <label><input type="checkbox" name="candidate.agreements.0.consent"> Ich stimme der Datenschutzerklärung zu</label>
  </fieldset>
  <button type="submit">Bewerbung absenden</button>
</form>
