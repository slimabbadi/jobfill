<form>
  <div class="form-group"><label for="anrede">Anrede *</label>
    <select id="anrede" name="salutation"><option value="">Bitte wählen</option><option value="1">Herr</option><option value="2">Frau</option><option value="3">Divers</option></select></div>
  <div class="form-group"><label for="titel">Titel</label><input type="text" id="titel" name="title"></div>
  <div class="form-group"><label for="vorname">Vorname *</label><input type="text" id="vorname" name="first_name"></div>
  <div class="form-group"><label for="name">Name *</label><input type="text" id="name" name="last_name_field"></div>
  <div class="form-group"><label for="mail">E-Mail *</label><input type="text" id="mail" name="mail"></div>
  <div class="form-group"><label for="tel">Telefon (mobil)</label><input type="text" id="tel" name="tel"></div>
  <div class="form-group"><label for="strasse">Straße und Hausnummer</label><input type="text" id="strasse"></div>
  <div class="form-group"><label for="plz">PLZ</label><input type="text" id="plz"></div>
  <div class="form-group"><label for="ort">Ort</label><input type="text" id="ort"></div>
  <div class="form-group"><label for="land">Land</label>
    <select id="land"><option value="">Bitte auswählen</option><option>Deutschland</option><option>Österreich</option><option>Schweiz</option></select></div>
  <div class="form-group"><label for="geb">Geburtsdatum</label><input type="text" id="geb" placeholder="TT.MM.JJJJ"></div>
  <div class="form-group"><label for="nat">Staatsangehörigkeit</label><input type="text" id="nat"></div>
  <div class="form-group"><label for="kf">Kündigungsfrist</label><input type="text" id="kf"></div>
  <div class="form-group"><label for="eintritt">Frühestmöglicher Eintrittstermin</label><input type="text" id="eintritt"></div>
  <div class="form-group"><label for="gehalt">Gehaltsvorstellung (brutto/Jahr)</label><input type="text" id="gehalt"></div>
  <div class="form-group"><label for="de">Deutschkenntnisse</label>
    <select id="de"><option value="">Bitte auswählen</option><option>Grundkenntnisse</option><option>Gute Kenntnisse</option><option>Fließend</option><option>Verhandlungssicher</option><option>Muttersprache</option></select></div>
  <div class="form-group"><label for="en">Englischkenntnisse</label>
    <select id="en"><option value="">Bitte auswählen</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></div>
  <fieldset><legend>Besitzen Sie eine gültige Arbeitserlaubnis für Deutschland?</legend>
    <label><input type="radio" name="permit" value="ja"> Ja</label>
    <label><input type="radio" name="permit" value="nein"> Nein</label></fieldset>
  <div class="form-group"><label for="xing">XING-Profil</label><input type="text" id="xing"></div>
  <div class="form-group"><label for="quelle">Wie sind Sie auf uns aufmerksam geworden?</label>
    <select id="quelle"><option value="">Bitte wählen</option><option>LinkedIn</option><option>StepStone</option><option>XING</option><option>Sonstiges</option></select></div>
  <div class="form-group"><label for="cv">Lebenslauf</label><input type="file" id="cv"></div>
  <div class="form-group"><label for="cover">Anschreiben</label><input type="file" id="cover"></div>
  <div class="form-group"><label for="zeugnisse">Zeugnisse</label><input type="file" id="zeugnisse"></div>
  <label><input type="checkbox" name="privacy"> Ich habe die Datenschutzhinweise gelesen.</label>
  <button type="submit">Jetzt bewerben</button>
</form>
